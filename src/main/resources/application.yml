server:
  error:
    include-message: always
    include-binding-errors: always

spring:
  datasource:
    # prefer environment variables; fallback defaults kept for local dev
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/registration}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:farhana}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        # optional; Hibernate can auto-detect dialect from driver in modern versions
        format_sql: true
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
